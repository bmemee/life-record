name: life_record
description: 个人资产与娱乐记录应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.4.11
  riverpod_annotation: ^2.3.3
  
  # 数据库
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 路由
  go_router: ^13.2.0
  
  # 图表
  fl_chart: ^0.66.0
  
  # 网络请求
  dio: ^5.4.0
  
  # 图片
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  
  # 工具
  intl: ^0.18.1
  uuid: ^4.3.1
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  url_launcher: ^6.2.3
  file_picker: ^6.1.1
  path: ^1.8.3
  
  # 提醒
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  drift_dev: ^2.14.1
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.10
  custom_lint: ^0.6.2
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true